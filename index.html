...</p><h3 id="大致设定" tabindex="-1">大致设定 <a class="header-anchor" href="#大致设定" aria-label="Permalink to &quot;大致设定&quot;">​</a></h3><p>公元3202年，一个最强的机器人国家和一个最强的人类国家发生了战争。由于使用了毁灭性巨大的武器，导致战争的核心区域时空紊乱。</p><p>200年后，机器人国和人类国联合招募敢死队。主角接到的任务就是作为第二期敢死队，进入战争死区探索。</p></div></div><!--]--></div></div></div><!----><!--[--><!--]--></div></div>
